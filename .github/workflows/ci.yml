name: Camera checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check
      - run: npm test
      - name: Build and test the ARM64 container
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          docker build -t orenda-usb-camera:check .
          docker run --rm -v "$PWD/test:/app/test:ro" orenda-usb-camera:check npm test
