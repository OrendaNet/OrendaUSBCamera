name: Release camera image
on:
  workflow_dispatch:
permissions:
  contents: write
  packages: write
  id-token: write
concurrency:
  group: camera-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check version and native runner
        id: version
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          VERSION="$(node -p "require('./package.json').version")"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          TAG="$(git ls-remote --tags origin "refs/tags/${VERSION}")"
          test -z "$TAG" || { echo 'Version already released; bump package.json.'; exit 1; }
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
      - run: npm run check
      - run: npm test
      - name: Test the actual ARM64 container
        run: |
          set -euo pipefail
          docker build -t orenda-usb-camera:check .
          docker run --rm -v "$PWD/test:/app/test:ro" orenda-usb-camera:check node --test test
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish ARM64 image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ghcr.io/orendanet/orenda-usb-camera:${{ steps.version.outputs.value }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          sbom: true
          provenance: mode=max
      - uses: sigstore/cosign-installer@v3.6.0
      - name: Sign immutable image
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: cosign sign --yes "ghcr.io/orendanet/orenda-usb-camera@${IMAGE_DIGEST}"
      - name: Generate market manifest
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: node scripts/release-manifest.js
      - name: Publish source release and manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.value }}
        run: gh release create "$VERSION" dist/orenda-app.json --target "$GITHUB_SHA" --title "Orenda USB Camera $VERSION" --notes-file docs/release-notes.md
